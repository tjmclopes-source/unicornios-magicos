<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe2f0">
<title>Unicórnios Mágicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: um ecrã de cada vez, botões gigantes para dedos pequenos, céu pastel de algodão-doce.
   Visual único e deliberado (não muda com o tema escuro). */
:root{
  --sky1:#ffe2f0; --sky2:#e6dcff; --sky3:#d2f0ff;
  --ink:#4a376e; --ink-soft:#7b68a0;
  --pink:#ff6fae; --pink-d:#d94a8a;
  --lilac:#a07cf0; --lilac-d:#7a55cc;
  --blue:#4fb6f5; --blue-d:#2c8ccb;
  --mint:#44cf9a; --mint-d:#2aa57a;
  --orange:#ff9a4d; --orange-d:#d9762c;
  --navy:#6c7ff0; --navy-d:#4b5ccc;
  --red:#ff6b7a; --red-d:#d94857;
  --teal:#2ec4c4; --teal-d:#1f9a9a;
  --green:#7cc96f; --green-d:#58a04c;
  --gold:#ffc94a; --gold-d:#d9a224;
  --card:#ffffffd9; --white:#ffffff; --shadow:#cbbbe8;
  --display:'Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;font-family:var(--display);color:var(--ink);
  background-color:var(--sky2);
  background-image:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,var(--sky3));
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
button:focus-visible{outline:4px solid var(--lilac-d);outline-offset:3px}
#app{position:relative;height:100%}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
}
.cloud{position:absolute;background:var(--white);border-radius:999px;opacity:.75;pointer-events:none}
.cloud::before,.cloud::after{content:"";position:absolute;background:var(--white);border-radius:50%}
.cloud::before{width:55%;height:160%;left:15%;bottom:20%}
.cloud::after{width:40%;height:120%;right:12%;bottom:25%}

/* barra superior */
.bar{display:flex;align-items:center;gap:10px;min-height:60px;padding-right:70px;flex:none}
.round{
  width:58px;height:58px;border-radius:50%;background:var(--white);font-size:28px;
  display:grid;place-items:center;box-shadow:0 5px 0 var(--shadow);flex:none;
}
.round:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
#soundBtn{position:fixed;z-index:30;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.bar h2{margin:0;font-size:clamp(22px,5vw,32px);font-weight:800;line-height:1.05;text-wrap:balance}
.pill{
  display:flex;align-items:center;gap:6px;background:var(--white);border-radius:999px;
  padding:6px 18px;font-size:28px;font-weight:800;box-shadow:0 5px 0 var(--shadow);font-variant-numeric:tabular-nums;
}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex:none}
.lvl{min-height:48px;padding:0 14px;border-radius:999px;background:var(--white);font-size:20px;font-weight:800;box-shadow:0 4px 0 #d5c8ee}
.lvl[aria-pressed="true"]{background:var(--lilac);color:var(--white);box-shadow:0 4px 0 var(--lilac-d)}
.progress{display:flex;gap:4px;font-size:28px;justify-content:center;line-height:1;flex:none}
.progress .off{filter:grayscale(1);opacity:.3}
.uni svg{width:100%;height:100%;display:block;overflow:visible}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-2deg)}}
.pop{animation:pop .45s ease}
@keyframes pop{30%{transform:scale(1.08) translateY(-14px) rotate(-3deg)}60%{transform:scale(.97)}}
.jump{animation:jump .7s ease}
@keyframes jump{40%{transform:translateY(-30px) rotate(-8deg)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes glow{50%{transform:scale(1.08)}}

/* MENU */
#menu{overflow-y:auto;align-items:center;gap:12px}
.head{display:flex;align-items:center;justify-content:center;gap:4px;padding-right:56px;flex:none;max-width:100%}
.head .uni{width:clamp(110px,30vw,190px);aspect-ratio:210/181;flex:none}
.logo{margin:0;font-weight:800;line-height:.9;font-size:clamp(34px,8vw,62px);color:var(--lilac-d);text-shadow:0 3px 0 var(--white),0 6px 0 #f2c6e0}
.logo span{display:block;color:var(--pink);font-size:1.1em}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:980px;padding-bottom:12px}
@media (min-width:760px){.games{grid-template-columns:repeat(5,minmax(0,1fr))}}
.game{
  border-radius:26px;color:var(--white);min-height:104px;padding:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  font-size:clamp(20px,4.6vw,26px);font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.15);
  background:var(--c);box-shadow:0 7px 0 var(--cd);
}
.game .ico{font-size:clamp(40px,10vw,56px);line-height:1.15;text-shadow:none}
.game:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}

/* VOAR */
#flyCanvas{flex:1;min-height:0;width:100%;border-radius:28px;background:rgba(255,255,255,.35);touch-action:none;display:block}
.hint{
  position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:var(--white);
  padding:10px 22px;border-radius:999px;font-size:clamp(20px,4.5vw,28px);font-weight:700;
  box-shadow:0 5px 0 var(--shadow);pointer-events:none;animation:pulse 1.4s ease-in-out infinite;white-space:nowrap;
}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07)}}

/* VESTIR */
.dress-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:16px 28px;flex-wrap:wrap;overflow-y:auto;padding-bottom:8px}
#dressUni{width:min(380px,80vw,34vh);aspect-ratio:210/181;max-width:100%;flex:none}
.panel{display:flex;flex-direction:column;gap:12px;background:var(--card);border-radius:28px;padding:16px;max-width:100%}
.row{display:flex;flex-direction:column;gap:6px}
.row .lbl{font-size:20px;font-weight:700;color:var(--ink-soft);padding-left:4px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:56px;height:56px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(74,55,110,.18),0 4px 0 #d5c8ee;transition:transform .15s}
.sw[aria-pressed="true"]{transform:scale(1.12);box-shadow:inset 0 0 0 3px var(--white),0 0 0 4px var(--lilac-d),0 4px 0 #d5c8ee}
.chip{height:56px;padding:0 16px;border-radius:999px;background:var(--white);font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 #d5c8ee}
.chip span{font-size:28px}
.chip[aria-pressed="true"]{background:var(--mint);color:var(--white);box-shadow:0 4px 0 var(--mint-d)}
.surprise{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-d)}

/* CONTAR */
.levels{display:flex;gap:8px}
.stage{position:relative;flex:1;min-height:0;background:rgba(255,255,255,.4);border-radius:28px}
.item{position:absolute;transform:translate(-50%,-50%);font-size:clamp(40px,9vmin,72px);line-height:1;padding:6px;border-radius:50%;animation:drop .4s backwards}
.item .num{position:absolute;right:-6px;top:-6px;min-width:30px;height:30px;border-radius:15px;background:var(--pink);color:var(--white);font-size:20px;font-weight:800;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 0 var(--pink-d)}
.item.on{background:rgba(255,255,255,.75)}
@keyframes drop{from{transform:translate(-50%,-140%) scale(.3);opacity:0}}
.ask{display:flex;align-items:center;justify-content:center;gap:10px;flex:none}
#countUni{width:96px;aspect-ratio:210/181;flex:none}
.bubble{background:var(--white);border-radius:24px;padding:8px 20px;font-size:clamp(22px,5vw,32px);font-weight:800;box-shadow:0 4px 0 #d5c8ee}
.answers{display:flex;justify-content:center;gap:clamp(10px,3vw,24px);padding-bottom:6px;flex:none}
.ans{width:clamp(90px,26vw,150px);height:clamp(90px,22vw,120px);border-radius:26px;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 7px 0 var(--shadow)}
.ans b,.opt .n{font-size:clamp(46px,11vw,64px);line-height:.9;color:var(--lilac-d)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:86px;margin-top:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--pink)}
.ans:active,.opt:active{transform:translateY(5px);box-shadow:0 2px 0 var(--shadow)}
.ans.right,.opt.right{background:var(--mint);box-shadow:0 7px 0 var(--mint-d);color:var(--white)}
.ans.right b,.opt.right .n{color:var(--white)}
.ans.right .dots i,.opt.right .dots i{background:var(--white)}
.opt.chosen{background:var(--pink);box-shadow:0 7px 0 var(--pink-d);color:var(--white)}
.ans.wrong,.opt.wrong{opacity:.35;animation:shake .4s}

/* PERGUNTAS (Contas, Inglês, Palco, Pensar) */
.prompt{background:var(--card);border-radius:28px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;flex:none}
.qrow{display:flex;align-items:center;justify-content:center;gap:10px;max-width:100%}
#quizUni{width:76px;aspect-ratio:210/181;flex:none}
.qtext{font-size:clamp(21px,5vw,30px);font-weight:800;line-height:1.15;text-wrap:balance;min-width:0}
.qtext b{color:var(--pink)}
.speak{width:50px;height:50px;font-size:24px;border-radius:50%;background:var(--white);box-shadow:0 4px 0 #d5c8ee;flex:none}
.visual:empty{display:none}
.eq{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.grp{display:flex;flex-wrap:wrap;justify-content:center;font-size:clamp(28px,7vmin,46px);line-height:1.1;max-width:42vw;background:rgba(255,255,255,.7);border-radius:18px;padding:4px 8px}
.op{font-size:44px;font-weight:800;color:var(--pink)}
.gone{position:relative;opacity:.35}
.gone::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:var(--red-d);font-weight:800;font-size:.9em;opacity:1}
.opts{flex:1;min-height:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:12px;overflow-y:auto;padding:4px 0 10px}
.opt{
  width:clamp(98px,28vw,170px);min-height:clamp(100px,24vw,140px);border-radius:26px;background:var(--white);box-shadow:0 7px 0 var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;
}
.opt .e{font-size:clamp(44px,11vw,64px);line-height:1.1}
.opt .l{font-size:clamp(15px,3.8vw,19px);font-weight:700;line-height:1.1;text-wrap:balance}
.blob{width:clamp(56px,15vw,78px);aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(74,55,110,.18)}
.fact{background:var(--white);border-radius:22px;padding:10px 12px 10px 16px;font-size:clamp(17px,4vw,21px);font-weight:600;line-height:1.25;display:flex;gap:12px;align-items:center;justify-content:space-between;flex:none;box-shadow:0 4px 0 #d5c8ee}
.next{flex:none;font-size:22px;font-weight:800;background:var(--mint);color:var(--white);border-radius:999px;padding:8px 18px;box-shadow:0 5px 0 var(--mint-d);animation:glow 1.2s infinite}

/* SÍLABAS */
.syl{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.syl-pic{font-size:clamp(84px,22vmin,150px);line-height:1}
.slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.slot{min-width:78px;height:72px;border-radius:18px;border:4px dashed #b9a6e0;display:grid;place-items:center;font-size:34px;font-weight:800;padding:0 8px;background:rgba(255,255,255,.5)}
.slot.full{border-style:solid;border-color:var(--mint);background:var(--white);color:var(--mint-d);animation:pop .4s}
.word{font-size:clamp(30px,8vw,46px);font-weight:800;color:var(--pink);min-height:1.2em;letter-spacing:2px}
.tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding-bottom:10px;flex:none}
.tile{min-width:88px;height:78px;border-radius:20px;background:var(--gold);font-size:36px;font-weight:800;box-shadow:0 6px 0 var(--gold-d);padding:0 12px}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-d)}
.tile.used{visibility:hidden}
.tile.wrong{animation:shake .4s}
.tile.hint{animation:glow 1s infinite}

/* MÚSICA */
.mus{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-bottom:8px}
.keys{display:flex;gap:5px;height:clamp(160px,34vh,280px);flex:none;touch-action:none}
.key{
  flex:1;min-width:0;border-radius:10px 10px 20px 20px;background:var(--white);position:relative;
  box-shadow:0 7px 0 var(--shadow);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:10px;
  font-size:clamp(14px,3.6vw,20px);font-weight:800;overflow:visible;
}
.key::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;border-radius:0 0 20px 20px;background:var(--k);opacity:.9}
.key span{position:relative;z-index:1;color:var(--white);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.key.down{transform:translateY(5px);box-shadow:0 2px 0 var(--shadow);filter:brightness(1.08)}
.key.next{outline:5px solid var(--k);outline-offset:2px}
.key.next::before{content:"⭐";position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:clamp(20px,5vw,32px);animation:glow 1s infinite}
.pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;flex:none}
.pad{min-height:84px;border-radius:22px;background:var(--white);box-shadow:0 6px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:700;touch-action:none}
.pad span{font-size:36px;line-height:1.1}
.pad.down{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.sect{font-size:16px;font-weight:700;color:var(--ink-soft);margin:0 0 -6px 4px}
.mus .chips{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:2px 2px 8px;scrollbar-width:none}
.mus .chips::-webkit-scrollbar{display:none}
.mus .lvl{flex:none;min-height:44px;font-size:18px}
.mus .fact{font-size:15px;padding:8px 12px}

/* COZINHA */
.recipes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;overflow-y:auto;padding-bottom:10px}
@media (min-width:760px){.recipes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rcard{min-height:120px;border-radius:26px;background:var(--white);box-shadow:0 7px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(18px,4.4vw,24px);font-weight:800;padding:8px}
.rcard span{font-size:clamp(46px,12vw,64px);line-height:1.1}
.rcard:active{transform:translateY(5px);box-shadow:0 2px 0 var(--shadow)}
.note{text-align:center;font-size:17px;font-weight:600;color:var(--ink-soft);margin:0;flex:none}
.cook{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.stepdots{display:flex;gap:6px;justify-content:center;flex:none}
.stepdots i{width:14px;height:14px;border-radius:50%;background:var(--white);box-shadow:inset 0 0 0 2px #d5c8ee}
.stepdots i.done{background:var(--mint);box-shadow:none}
.stepdots i.now{background:var(--gold);box-shadow:none;transform:scale(1.25)}
.measure{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:clamp(28px,7vw,38px);line-height:1}
.measure span{opacity:.25;filter:grayscale(.6);transition:.2s}
.measure span.done{opacity:1;filter:none;transform:scale(1.1)}
.kitchen{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.station{position:relative;width:min(260px,62vw,30vh);aspect-ratio:1;max-width:100%}
.station .tool{font-size:min(190px,45vw,22vh);line-height:1;display:block}
.station .pile{position:absolute;left:18%;right:18%;top:8%;height:42%;pointer-events:none}
.station .pile span{position:absolute;font-size:min(34px,8vw,4vh);transform:translate(-50%,-50%)}
.station .badge{position:absolute;right:-6px;top:-6px;min-width:60px;height:60px;border-radius:30px;background:var(--pink);color:var(--white);font-size:34px;font-weight:800;display:grid;place-items:center;box-shadow:0 4px 0 var(--pink-d)}
.station.stir .tool{animation:stir .5s}
@keyframes stir{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.station.tapme{animation:glow 1.2s infinite}
.shelf{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;flex:none}
.ing{width:clamp(76px,21vw,96px);min-height:84px;border-radius:20px;background:var(--white);box-shadow:0 5px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:700;line-height:1.1;padding:4px}
.ing span{font-size:clamp(32px,8vw,42px);line-height:1.15}
.ing:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.ing.wrong{animation:shake .4s}
.ing.want{animation:glow 1s infinite}

/* FESTA */
#party{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(74,55,110,.35);padding:16px}
.party-card{background:var(--white);border-radius:36px;padding:20px 24px 26px;text-align:center;max-width:420px;width:100%;box-shadow:0 10px 0 var(--shadow);animation:pop .6s}
#partyUni{width:min(220px,55vw);aspect-ratio:210/181;margin:0 auto}
.dish{font-size:64px;line-height:1.1}
#partyText{margin:4px 0 14px;font-size:clamp(30px,7vw,44px);font-weight:800;color:var(--pink);line-height:1.05;text-wrap:balance}
.again{font-size:28px;font-weight:800;background:var(--mint);color:var(--white);border-radius:999px;padding:10px 34px;box-shadow:0 6px 0 var(--mint-d)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (max-height:560px){
  #countUni,#quizUni{display:none}
  .keys{height:150px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <div class="cloud" style="width:140px;height:44px;left:6%;top:16%"></div>
  <div class="cloud" style="width:180px;height:54px;right:4%;top:58%"></div>
  <div class="cloud" style="width:110px;height:36px;left:12%;bottom:8%"></div>

  <button id="soundBtn" class="round" aria-label="Som ligado ou desligado">🔊</button>

  <!-- MENU -->
  <section id="menu" class="screen">
    <div class="head">
      <div id="menuUni" class="uni bob"></div>
      <h1 class="logo">Unicórnios <span>Mágicos</span></h1>
    </div>
    <nav class="games" aria-label="Jogos">
      <button class="game" style="--c:var(--pink);--cd:var(--pink-d)" data-go="fly"><span class="ico">⭐</span>Voar</button>
      <button class="game" style="--c:var(--lilac);--cd:var(--lilac-d)" data-go="dress"><span class="ico">🎨</span>Vestir</button>
      <button class="game" style="--c:var(--blue);--cd:var(--blue-d)" data-go="count"><span class="ico">🔢</span>Contar</button>
      <button class="game" style="--c:var(--orange);--cd:var(--orange-d)" data-go="quiz:contas"><span class="ico">➕</span>Contas</button>
      <button class="game" style="--c:var(--mint);--cd:var(--mint-d)" data-go="silabas"><span class="ico">🔤</span>Sílabas</button>
      <button class="game" style="--c:var(--navy);--cd:var(--navy-d)" data-go="quiz:ingles"><span class="ico">🇬🇧</span>Inglês</button>
      <button class="game" style="--c:var(--red);--cd:var(--red-d)" data-go="musica"><span class="ico">🎹</span>Música</button>
      <button class="game" style="--c:var(--teal);--cd:var(--teal-d)" data-go="quiz:palco"><span class="ico">🎭</span>Teatro</button>

<script>
(function(){

    ['ellipse','cx="92" cy="103" rx="54" ry="33"',body],
    ['path','d="M118 98 C124 76 130 60 138 42 L170 52 C162 72 156 92 148 112 Z"',body],
    ['rect','x="76" y="116" width="15" height="44" rx="7"',body],['rect','x="128" y="112" width="15" height="46" rx="7"',body],
    ['path','d="M140 32 L141 8 L156 28 Z"',body],
    ['ellipse','cx="154" cy="48" rx="27" ry="23"',body],['ellipse','cx="175" cy="60" rx="17" ry="14"',body]

  [[58,150],[110,150],[76,152],[128,150]].forEach(p => s += `<rect x="${p[0]}" y="${p[1]}" width="15" height="9" rx="4" fill="${horn}" stroke="${LINE}" stroke-width="2.5"/>`);
  s += `<path d="M143.5 27 L144 14 L151 26 Z" fill="#ffb3cf"/>`;
  s += `<path d="M146 27 L165 -3 L161 31 Z" fill="${horn}" stroke="${LINE}" stroke-width="2.5" stroke-linejoin="round"/>`;
  s += `<path d="M150 21 L161 23 M154 13 L162 15 M158 5 L163 6.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>`;

    ['circle','cx="129" cy="48" r="12"',m(2)],['circle','cx="137" cy="35" r="11"',m(1)],['circle','cx="147" cy="27" r="9"',m(0)]

    s += `<path d="M90 88 C72 42 36 38 32 62 C18 64 20 86 44 88 C32 98 46 112 72 100 Z" fill="${w}" stroke="${LINE}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s += `<path d="M84 86 C66 64 52 58 44 62 M80 92 C66 84 52 82 40 80 M76 98 C62 96 54 98 48 100" stroke="${LINE}" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".45"/>`;
  }
  if (happy) s += `<path d="M153 49 Q160 40 167 49" stroke="#3b2a55" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
  else s += `<ellipse cx="160" cy="46" rx="4.6" ry="6.2" fill="#3b2a55"/><circle cx="161.8" cy="43.4" r="1.9" fill="#fff"/>
             <path d="M155.5 41 L151.5 37.5 M157 39.5 L154.5 35" stroke="#3b2a55" stroke-width="2" stroke-linecap="round"/>`;
  s += `<circle cx="167" cy="58" r="5.5" fill="#ff8fb8" opacity=".5"/><circle cx="185" cy="56" r="1.7" fill="${LINE}"/>`;
  s += `<path d="${happy ? 'M173 66 Q179 74 186 65' : 'M174 67 Q179 71 185 66'}" stroke="${LINE}" stroke-width="2.4" fill="${happy ? '#ff7aa8' : 'none'}" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (c.crown){
    s += `<path d="M124 30 L124 13 L131 21 L136 8 L141 20 L148 12 L146 30 Z" fill="#ffd23f" stroke="${LINE}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s += `<circle cx="130" cy="25" r="2.4" fill="#ff5c9d"/><circle cx="137" cy="24" r="2.4" fill="#5ec2ff"/><circle cx="143" cy="25" r="2.4" fill="#6fdc9a"/>`;
  }

const svgURL = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
const UNI_SLOTS = ['#menuUni','#dressUni','#countUni','#quizUni','#partyUni'];
function renderUnis(){ UNI_SLOTS.forEach(id => { $(id).innerHTML = unicornSVG(cfg, id === '#partyUni'); }); }

/* ================= SOM E VOZ ================= */
let AC = null, soundOn = store.get('uni-sound', true), voice = null, voiceEn = null;
function ac(){
  if (!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, t0, dur, type, vol){
  if (!soundOn) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (t0||0);
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .16, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + (dur||.25));
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + (dur||.25) + .05);
}
const PENTA = [523,587,659,784,880,1047,1175,1319,1568]; let ci = 0;
const chime = () => { tone(PENTA[ci++ % PENTA.length], 0, .35, 'triangle', .18); tone(PENTA[(ci+2) % PENTA.length]*2, .05, .2, 'sine', .05); };
const fanfare = () => [523,659,784,1047,1319].forEach((f,i) => tone(f, i*.11, .4, 'triangle', .18));
const oops = () => { tone(392,0,.18,'sine',.12); tone(330,.15,.28,'sine',.12); };
const pop = () => tone(700, 0, .08, 'triangle', .1);
function pickVoice(){
  try{ const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /pt[-_]PT/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null;
    voiceEn = vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; }catch(e){}
}
if ('speechSynthesis' in window){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function say(t, lang, queue){
  if (!soundOn || !t || !('speechSynthesis' in window)) return;
  try{
    if (!queue) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t), en = lang === 'en';
    u.lang = en ? 'en-GB' : 'pt-PT'; const v = en ? voiceEn : voice; if (v) u.voice = v;

}

/* ================= CONFETES E FESTA ================= */
const cf = $('#confetti'), cfx = cf.getContext('2d'); let bits = [], cfRun = false;
const RAINBOW = ['#ff6b9a','#ffa95e','#ffd84d','#6fdc9a','#5ec2ff','#a98bff'];
function confetti(){
  cf.width = innerWidth; cf.height = innerHeight;
  for (let i=0;i<120;i++) bits.push({x:rand(0,cf.width), y:rand(-cf.height*.6,-10), vx:rand(-1,1), vy:rand(2,5), r:rand(5,10), c:pick(RAINBOW), a:rand(0,6), s:Math.random()<.4});

}
function cfLoop(){
  cfx.clearRect(0,0,cf.width,cf.height);
  bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.a += .1;
    cfx.save(); cfx.translate(b.x,b.y); cfx.rotate(b.a); cfx.fillStyle = b.c;
    if (b.s){ cfx.font = (b.r*2.4)+'px serif'; cfx.fillText('⭐',-b.r,b.r); } else cfx.fillRect(-b.r/2,-b.r/4,b.r,b.r/2);
    cfx.restore(); });

  if (bits.length) requestAnimationFrame(cfLoop); else { cfRun = false; cfx.clearRect(0,0,cf.width,cf.height); }
}

/* ================= VOAR ================= */
const cv = $('#flyCanvas'), g = cv.getContext('2d');
const TREATS = ['⭐','💖','🌈','🧁','🦋','🍓','💎','🌸','🍭'];
const fly = {run:false, W:0, H:0, x:0, y:0, tx:0, ty:0, vy:0, items:[], parts:[], clouds:[], score:0, last:0, spawn:0, t:0, img:new Image(), happyImg:new Image(), banner:0, bannerText:''};
function sizeFly(){
  const r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);

  fly.W = r.width; fly.H = r.height;
}
function uniSize(){ const w = Math.max(90, Math.min(170, Math.min(fly.W, fly.H)*.3)); return [w, w*181/210]; }
function startFly(){
  fly.img.src = svgURL(unicornSVG(cfg)); fly.happyImg.src = svgURL(unicornSVG(cfg, true));
  requestAnimationFrame(() => {
    sizeFly();
    if (!fly.x || fly.x > fly.W || fly.y > fly.H){ fly.x = fly.tx = fly.W*.28; fly.y = fly.ty = fly.H*.5; }
    if (!fly.clouds.length) for (let i=0;i<6;i++) fly.clouds.push({x:rand(0,fly.W), y:rand(20,fly.H*.9), s:rand(.5,1.3)});

function pointerTo(e){

document.addEventListener('visibilitychange', () => { if (!document.hidden && current === 'fly' && !fly.run) startFly(); else if (document.hidden) fly.run = false; });
function burst(x, y, n, big){
  for (let i=0;i<n;i++){ const a = rand(0,Math.PI*2), sp = rand(60, big ? 320 : 180);
    fly.parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, r:rand(3,big?9:6), c:pick(RAINBOW), star:Math.random()<.3}); }
}
function drawCloud(x, y, s){
  g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath();
  g.arc(x, y, 26*s, 0, 7); g.arc(x+28*s, y-12*s, 32*s, 0, 7); g.arc(x+60*s, y, 24*s, 0, 7); g.fill();
  g.fillRect(x, y-4*s, 60*s, 28*s);
}
function flyLoop(now){
  if (!fly.run) return;
  const dt = Math.min(.05, (now - fly.last)/1000); fly.last = now; fly.t += dt;
  const W = fly.W, H = fly.H, [uw, uh] = uniSize();
  g.clearRect(0,0,W,H);
  fly.clouds.forEach(c => { c.x -= 20*c.s*dt; if (c.x < -120*c.s){ c.x = W + 20; c.y = rand(20, H*.9); } drawCloud(c.x, c.y, c.s); });
  const py = fly.y; fly.x += (fly.tx - fly.x)*Math.min(1, dt*5); fly.y += (fly.ty - fly.y)*Math.min(1, dt*5);
  fly.x = Math.max(uw*.4, Math.min(W - uw*.4, fly.x)); fly.y = Math.max(uh*.4, Math.min(H - uh*.4, fly.y));
  fly.vy = (fly.y - py)/Math.max(dt,.001);
  if (Math.random() < .7) fly.parts.push({x:fly.x - uw*.38, y:fly.y + rand(-6,6) + Math.sin(fly.t*4)*6, vx:rand(-80,-40), vy:rand(-10,10), life:.9, r:rand(4,7), c:RAINBOW[Math.floor(fly.t*10)%6], star:false});
  fly.spawn -= dt;
  if (fly.spawn <= 0){
    fly.spawn = rand(.6, 1.1);
    fly.items.push({e:pick(TREATS), x:W + 30, by:rand(40, H-40), ph:rand(0,6), amp:rand(8,26), vx:-rand(70,120) - Math.min(fly.score,80)*.8, sz:rand(34,46)});
  }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const it of fly.items){
    it.x += it.vx*dt; it.y = it.by + Math.sin(fly.t*2 + it.ph)*it.amp;
    const dx = it.x - (fly.x + uw*.15), dy = it.y - fly.y;
    if (!it.got && dx*dx + dy*dy < Math.pow(uw*.42 + it.sz*.3, 2)){
      it.got = true; fly.score++; $('#flyScore').textContent = fly.score; chime(); burst(it.x, it.y, 14);
      fly.happy = .6;
      if (fly.score % 10 === 0){
        fanfare(); burst(fly.x, fly.y, 60, true); fly.banner = 2;
        fly.bannerText = pick(['Fantástico!','Brilhante!','Mágico!','Super!','Uau!']);
        say(fly.bannerText + ' Já tens ' + fly.score + ' estrelas!');
      }
    }
    if (!it.got){ g.font = it.sz + 'px serif'; g.fillText(it.e, it.x, it.y + Math.sin(fly.t*3+it.ph)*2); }
  }
  fly.items = fly.items.filter(it => !it.got && it.x > -60);
  for (const p of fly.parts){
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 40*dt; p.life -= dt*1.3;
    g.globalAlpha = Math.max(0, p.life); g.fillStyle = p.c;
    if (p.star){ g.font = (p.r*3)+'px serif'; g.fillText('✨', p.x, p.y); } else { g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
  }
  g.globalAlpha = 1; fly.parts = fly.parts.filter(p => p.life > 0);
  fly.happy = Math.max(0, (fly.happy||0) - dt);
  const img = fly.happy > 0 && fly.happyImg.complete ? fly.happyImg : fly.img;
  if (img.complete){
    g.save(); g.translate(fly.x, fly.y + Math.sin(fly.t*3)*6);
    g.rotate(Math.max(-.35, Math.min(.35, fly.vy/900)));
    try{ g.drawImage(img, -uw/2, -uh/2, uw, uh); }catch(e){}
    g.restore();
  }
  if (fly.banner > 0){
    fly.banner -= dt; const s = 1 + Math.sin(Math.min(1,(2-fly.banner)*3)*Math.PI)*.15;
    g.save(); g.translate(W/2, H*.22); g.scale(s, s);
    g.font = '800 ' + Math.min(64, W/7) + "px 'Baloo 2', 'Comic Sans MS', sans-serif";
    g.lineWidth = 10; g.strokeStyle = '#ffffff'; g.lineJoin = 'round'; g.strokeText(fly.bannerText, 0, 0);
    g.fillStyle = '#ff6fae'; g.fillText(fly.bannerText, 0, 0); g.restore();
  }
  requestAnimationFrame(flyLoop);
}

const THINGS = [['⭐','estrelas','f'],['🍓','morangos','m'],['🧁','bolinhos','m'],['🦋','borboletas','f'],['🌸','flores','f'],
                ['💖','corações','m'],['🍭','chupas','m'],['🎈','balões','m'],['🐞','joaninhas','f'],['🍎','maçãs','f']];
let countMax = store.get('uni-max', 5), wins = 0, round = null, lastN = 0;
function paintLevels(){ document.querySelectorAll('#count .lvl').forEach(b => b.setAttribute('aria-pressed', +b.dataset.max === countMax)); }
document.querySelectorAll('#count .lvl').forEach(b => b.addEventListener('click', () => {
  countMax = +b.dataset.max; store.set('uni-max', countMax); wins = 0; pop(); paintLevels(); newRound();
}));
const numOpt = o => `<b class="n">${o}</b><span class="dots">${'<i></i>'.repeat(o)}</span>`;
function nearNumbers(n, lo, hi){
  const s = new Set([n]); let guard = 0;
  while (s.size < 3 && guard++ < 50){ const o = n + pick([-2,-1,1,2]); if (o >= lo && o <= hi) s.add(o); }
  return [...s].sort((a,b) => a-b);
}
function newRound(){
  let n; do { n = 1 + Math.floor(Math.random()*countMax); } while (n === lastN && countMax > 1);
  lastN = n;
  const th = pick(THINGS);
  round = {n, th, counted:0, locked:false};
  const cells = []; for (let r=0;r<3;r++) for (let c=0;c<5;c++) cells.push([c,r]);
  const sc = shuffle(cells);
  const st = $('#stage'); st.innerHTML = '';
  for (let i=0;i<n;i++){
    const [c, r] = sc[i], b = document.createElement('button'); b.className = 'item';
    b.style.left = (10 + c*20 + rand(-4,4)) + '%'; b.style.top = (18 + r*32 + rand(-6,6)) + '%';
    b.style.animationDelay = (i*.06) + 's'; b.textContent = th[0]; b.setAttribute('aria-label', th[1]);
    b.addEventListener('click', () => {
      if (b.classList.contains('on') || round.locked) return;
      round.counted++; b.classList.add('on');
      const t = document.createElement('span'); t.className = 'num'; t.textContent = round.counted; b.appendChild(t);
      tone(PENTA[Math.min(round.counted-1, PENTA.length-1)], 0, .3, 'triangle', .16); say(WORDS[round.counted]);
    });
    st.appendChild(b);
  }
  const A = $('#answers'); A.innerHTML = '';
  nearNumbers(n, 1, Math.max(countMax, 6)).forEach(o => {
    const b = document.createElement('button'); b.className = 'ans'; b.setAttribute('aria-label', String(o));
    b.innerHTML = `<b>${o}</b><span class="dots">${'<i></i>'.repeat(o)}</span>`;
    b.addEventListener('click', () => answer(o, b));
    A.appendChild(b);
  });
  const q = (th[2] === 'f' ? 'Quantas ' : 'Quantos ') + th[1] + '?';
  $('#question').textContent = q; stars($('#progress'), wins);
  $('#countUni').innerHTML = unicornSVG(cfg);
  if (current === 'count') setTimeout(() => say(q), 350);
}
function answer(o, btn){
  if (round.locked || btn.classList.contains('wrong')) return;
  if (o === round.n){
    round.locked = true; btn.classList.add('right'); wins++; stars($('#progress'), wins);
    happyFor('#countUni', 1300); bounce($('#countUni'), 'jump');
    if (wins >= 5){
      setTimeout(() => party('Ganhaste! Muito bem!', () => { wins = 0; newRound(); }), 600);
    } else {
      fanfare(); say(pick(PRAISE) + ' São ' + WORDS[round.n] + '!');
      setTimeout(newRound, 1700);
    }
  } else { btn.classList.add('wrong'); oops(); say('Tenta outra vez!'); }
}

const recent = {};
function fresh(key, arr, id){
  const r = recent[key] || (recent[key] = []);
  let pool = arr.filter(x => !r.includes(id(x))); if (!pool.length){ r.length = 0; pool = arr; }
  const x = pick(pool); r.push(id(x)); if (r.length > Math.ceil(arr.length*.6)) r.shift(); return x;
}

  const vib = (o, depth, rate) => { const l = osc('sine', rate), lg = a.createGain(); lg.gain.value = depth; l.connect(lg); lg.connect(o.frequency); return l; };

function drum(kind){

    n.connect(f); f.connect(gg); gg.connect(a.destination);
    gg.gain.setValueAtTime(.0001, at); gg.gain.linearRampToValueAtTime(vol, at+.002); gg.gain.exponentialRampToValueAtTime(.0001, at+dec);
    n.start(at); n.stop(at+dec+.05);
  };

    const o = a.createOscillator(), gg = a.createGain(); o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(45, t+.3);

  ck.r = r; ck.i = 0; ck.c = 0; ck.pile = []; ck.busy = false;
  $('#ckList').hidden = true; $('#ckCook').hidden = false; $('#ckTitle').textContent = r.name; $('#ckBack').textContent = '⬅️';
  const used = [...new Set(r.steps.filter(s => s.ing).map(s => s.ing))];
  const extra = shuffle(Object.keys(ING).filter(k => !used.includes(k))).slice(0, 2);
  const S = $('#shelf'); S.innerHTML = '';
  shuffle(used.concat(extra)).forEach(k => {
    const b = document.createElement('button'); b.className = 'ing'; b.dataset.k = k; b.innerHTML = `<span>${ING[k][0]}</span>${ING[k][1]}`;
    b.addEventListener('click', () => tapIng(k, b)); S.appendChild(b);
  });
  cookStep();
}
function cookStep(){
  const r = ck.r, s = r.steps[ck.i];
  $('#ckDots').innerHTML = r.steps.map((_, j) => `<i class="${j < ck.i ? 'done' : j === ck.i ? 'now' : ''}"></i>`).join('');
  $('#ckSay').textContent = s.say; $('#ckTool').textContent = TOOL[s.st]; $('#ckBadge').hidden = true;
  $('#ckPile').hidden = s.st === 'soap' || s.st === 'oven';
  paintMeasure(); paintPile();
  $('#station').classList.toggle('tapme', s.t !== 'add');
  document.querySelectorAll('.ing').forEach(b => b.classList.remove('want'));
  clearTimeout(ck.hintT);
  if (s.t === 'add') ck.hintT = setTimeout(() => { const b = document.querySelector(`.ing[data-k="${s.ing}"]`); if (b && ck.r) b.classList.add('want'); }, 6000);
  say(s.say);
}
function paintMeasure(){
  const s = ck.r.steps[ck.i], M = $('#ckMeasure');
  if (s.t === 'oven'){ M.innerHTML = ''; return; }
  const icon = s.t === 'tap' ? '👆' : (s.unit ? UNIT[s.unit] : ING[s.ing][0]);
  M.innerHTML = Array.from({length:s.n}, (_, j) => `<span class="${j < ck.c ? 'done' : ''}">${icon}</span>`).join('');
}
function paintPile(){ $('#ckPile').innerHTML = ck.pile.map(p => `<span style="left:${p[1]}%;top:${p[2]}%">${p[0]}</span>`).join(''); }
function stepDone(){
  ck.busy = true; chime();
  setTimeout(() => {
    ck.busy = false; ck.i++; ck.c = 0;
    if (ck.i >= ck.r.steps.length){
      const r = ck.r;
      party('Que delícia! ' + r.name + '!', () => showRecipes(), r.done, 'Hum, que delícia! ' + r.name + '! ' + r.fact);
    } else cookStep();
  }, 700);
}
function tapIng(k, b){
  if (!ck.r || ck.busy) return; const s = ck.r.steps[ck.i];
  if (s.t === 'add' && k === s.ing){
    ck.c++; b.classList.remove('want');
    ck.pile.push([ING[k][0], rand(5,95), rand(10,90)]); if (ck.pile.length > 18) ck.pile.shift();
    paintPile(); paintMeasure(); bounce($('#station'), 'stir');
    tone(PENTA[Math.min(ck.c, PENTA.length-1)], 0, .25, 'triangle', .16); say(WORDS[ck.c] || String(ck.c));
    if (ck.c >= s.n) stepDone();
  } else {
    bounce(b, 'wrong'); oops();
    say(s.t === 'add' ? 'Ainda não! Agora precisamos de ' + ING[s.ing][1].toLowerCase() + '.' : s.say);
  }
}
$('#station').addEventListener('click', () => {
  if (!ck.r || ck.busy) return; const s = ck.r.steps[ck.i];
  if (s.t === 'tap'){
    ck.c++; paintMeasure(); bounce($('#station'), 'stir'); tone(s.st === 'soap' ? 900 : 500 + ck.c*40, 0, .15, 'sine', .14);
    if (s.st === 'soap') say(ck.c === 1 ? 'Esfrega, esfrega!' : '');
    if (ck.c >= s.n) stepDone();
  } else if (s.t === 'oven'){
    ck.busy = true; $('#station').classList.remove('tapme'); let n = 5; const B = $('#ckBadge'); B.hidden = false;
    const tick = () => {
      if (!ck.r) return;
      if (n === 0){ B.hidden = true; tone(1568,0,.6,'sine',.2); tone(2093,.15,.6,'sine',.15); ck.busy = false; stepDone(); return; }
      B.textContent = n; say(WORDS[n]); tone(440, 0, .1, 'square', .05); n--; setTimeout(tick, 1000);
    };
    tick();
  } else {
    say(s.say);
  }
});
$('#ckSpeak').addEventListener('click', () => { if (ck.r) say(ck.r.steps[ck.i].say); });

/* ================= ARRANQUE ================= */
renderUnis(); paintLevels(); stars($('#progress'), 0);
})();
</script>
</body>
